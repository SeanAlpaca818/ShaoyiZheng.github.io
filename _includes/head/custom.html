{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="#ffffff"/>

<!-- Theme mode — inline critical path. Must stay synchronous and in <head>:
     it has to settle data-theme BEFORE first paint, or the page flashes the
     config default before the visitor's stored choice is applied. -->
<script>
(function () {
  var stored = null;
  try {
    stored = localStorage.getItem('color-mode');
    /* retired 19-color cycle — clear its leftovers from returning visitors */
    localStorage.removeItem('accent-color-index');
    localStorage.removeItem('accent-cp-reset-v2');
  } catch (e) {}

  var mode = (stored === 'light' || stored === 'dark')
    ? stored
    : '{{ site.color_mode | default: "light" }}';

  if (mode === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
  } else {
    document.documentElement.removeAttribute('data-theme');
  }
})();
</script>

<!-- end custom head snippets -->
