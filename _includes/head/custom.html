  function hex2rgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
  function rgb2hex(r,g,b){return'#'+((1<<24)+(Math.round(r)<<16)+(Math.round(g)<<8)+Math.round(b)).toString(16).slice(1);}
  function hexToRgbStr(h){var c=hex2rgb(h);return c[0]+','+c[1]+','+c[2];}
  function hsl(h,s,l){return'hsl('+h+','+s+'%,'+l+'%)';}
  function buildVars(accent,deep,light,h,s,isDark){
    var a=hexToRgbStr(accent);
    var glow=isDark?'rgba('+a+',0.22)':'rgba('+a+',0.30)';
    var bg;
    if(isDark){
      bg={heroBg:hsl(h,Math.min(s,60),6),sectionBg:hsl(h,Math.min(s,40),9),
        sectionAltBg:hsl(h,Math.min(s,30),14),cardBg:hsl(h,Math.min(s,25),17),
        cardBorder:hsl(h,Math.min(s,20),22),cardShadow:'rgba(0,0,0,0.30)',
        timelineLine:hsl(h,15,32),surface:hsl(h,Math.min(s,25),17),
        surfaceRaised:hsl(h,Math.min(s,40),9),
        globalBg:hsl(h,Math.min(s,40),9),footerBg:hsl(h,Math.min(s,40),9)};
    }else{
      bg={heroBg:hsl(h,s,8),sectionBg:hsl(h,Math.min(s,40),91),
        sectionAltBg:hsl(h,Math.min(s,30),94),cardBg:hsl(h,Math.min(s,25),96),
        cardBorder:hsl(h,Math.min(s,30),87),cardShadow:'rgba('+a+',0.10)',
        timelineLine:hsl(h,20,78),surface:hsl(h,Math.min(s,25),96),
        surfaceRaised:hsl(h,Math.min(s,35),93),
        globalBg:hsl(h,Math.min(s,30),94),footerBg:hsl(h,Math.min(s,35),91)};
    }
    return{accent:accent,deep:deep,light:light,glow:glow,wave:'rgba('+a+',0.55)',bg:bg};
  }
  function setVars(v,tlEdu,tlPub,tlInd){
    var r=document.documentElement;
    r.style.setProperty('--home-accent',v.accent);
    r.style.setProperty('--home-accent-glow',v.glow);
    r.style.setProperty('--gt-accent',v.accent);
    r.style.setProperty('--gt-accent-glow',v.glow);
    r.style.setProperty('--global-link-color',v.accent);
    r.style.setProperty('--global-link-color-visited',v.accent);
    r.style.setProperty('--global-link-color-hover',v.deep);
    r.style.setProperty('--global-base-color',v.accent);
    r.style.setProperty('--global-masthead-link-color-hover',v.accent);
    r.style.setProperty('--home-hero-bg',v.bg.heroBg);
    r.style.setProperty('--home-section-bg',v.bg.sectionBg);
    r.style.setProperty('--home-section-alt-bg',v.bg.sectionAltBg);
    r.style.setProperty('--home-card-bg',v.bg.cardBg);
    r.style.setProperty('--home-card-border',v.bg.cardBorder);
    r.style.setProperty('--home-card-shadow',v.bg.cardShadow);
    r.style.setProperty('--home-timeline-line',v.bg.timelineLine);
    r.style.setProperty('--gt-surface',v.bg.surface);
    r.style.setProperty('--gt-surface-raised',v.bg.surfaceRaised);
    r.style.setProperty('--global-bg-color',v.bg.globalBg);
    r.style.setProperty('--global-footer-bg-color',v.bg.footerBg);
    r.style.setProperty('--home-tl-edu',tlEdu);
    r.style.setProperty('--home-tl-pub',tlPub);
    r.style.setProperty('--home-tl-ind',tlInd);
    r.style.setProperty('--color-hero-border',v.light);
  }
  function applyInstant(idx){
    var p=RAW[idx];
    var isDark=document.documentElement.getAttribute('data-theme')==='dark';
    var v=buildVars(p[0],p[1],p[2],p[3],p[4],isDark);
    var tl=isDark?[p[8],p[9],p[10]]:[p[5],p[6],p[7]];
    setVars(v,tl[0],tl[1],tl[2]);
  }
  var idx=0;
  try{var s=localStorage.getItem('accent-color-index');if(s!==null&&RAW[parseInt(s,10)])idx=parseInt(s,10);}catch(e){}
  applyInstant(idx);
  window.__cp={RAW:RAW,idx:idx,hex2rgb:hex2rgb,rgb2hex:rgb2hex,hexToRgbStr:hexToRgbStr,hsl:hsl,buildVars:buildVars,setVars:setVars,applyInstant:applyInstant};
})();
